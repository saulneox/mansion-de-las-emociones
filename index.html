<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Mansión de las Emociones</title>
<meta name="description" content="Juego interactivo de Halloween sobre el desarrollo emocional en la adultez. Psicología y curso de vida, UNAD.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --noche: #12091f;
    --morado: #2a1546;
    --morado-2: #3d1f66;
    --calabaza: #ff7a1a;
    --calabaza-2: #ffb347;
    --lima: #b6ff3b;
    --hueso: #fff4e0;
    --rojo: #ff4d6d;
    --sombra: 0 18px 50px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--hueso);
    background: var(--noche);
    overflow-x: hidden;
  }

  /* ---------- Fondo de escena ---------- */
  #fondo, #fondo-sig {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 50% 20%, #4b2380 0%, #1b0d2e 55%, #0a0512 100%);
    background-size: cover; background-position: center;
    transition: opacity 1.2s ease;
  }
  #fondo-sig { opacity: 0; }
  #velo {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse at center, rgba(18,9,31,.25) 0%, rgba(18,9,31,.75) 75%),
      linear-gradient(to bottom, rgba(18,9,31,.2), rgba(18,9,31,.85));
  }
  #niebla {
    position: fixed; left: -20%; right: -20%; bottom: -40px; height: 220px; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 30% 60%, rgba(182,255,59,.16), transparent 60%),
                radial-gradient(ellipse at 70% 70%, rgba(200,180,255,.14), transparent 60%);
    filter: blur(18px);
    animation: niebla 14s ease-in-out infinite alternate;
  }
  @keyframes niebla { from { transform: translateX(-6%); } to { transform: translateX(6%); } }

  .murcielago {
    position: fixed; z-index: 2; pointer-events: none; font-size: 26px; opacity: .8;
    animation: volar linear infinite;
  }
  @keyframes volar {
    0%   { transform: translate(-10vw, 0) scale(.8); }
    25%  { transform: translate(25vw, -4vh) scale(1); }
    50%  { transform: translate(55vw, 3vh) scale(.9); }
    75%  { transform: translate(85vw, -3vh) scale(1); }
    100% { transform: translate(115vw, 0) scale(.8); }
  }

  /* ---------- Barra superior ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 18px;
    background: linear-gradient(to bottom, rgba(10,5,18,.85), rgba(10,5,18,0));
  }
  #hud.oculto { display: none; }
  .hud-izq { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(42,21,70,.85); border: 1px solid rgba(255,179,71,.35);
    padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 14px;
  }
  #velas { letter-spacing: 2px; font-size: 18px; }
  .vela-apagada { filter: grayscale(1) brightness(.5); opacity: .45; }
  #btn-sonido {
    background: rgba(42,21,70,.85); color: var(--hueso); border: 1px solid rgba(255,179,71,.35);
    border-radius: 999px; padding: 6px 12px; font-size: 16px; cursor: pointer;
  }
  #progreso { position: fixed; top: 0; left: 0; height: 4px; z-index: 21; background: linear-gradient(90deg, var(--calabaza), var(--lima)); width: 0; transition: width .6s ease; }

  /* ---------- Layout ---------- */
  #app {
    position: relative; z-index: 10;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 76px 16px 32px;
  }
  .pantalla { width: 100%; max-width: 1080px; animation: entrar .6s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes entrar { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: none; } }

  .escena { display: grid; grid-template-columns: minmax(220px, 360px) 1fr; gap: 28px; align-items: center; }
  @media (max-width: 760px) { .escena { grid-template-columns: 1fr; gap: 8px; } }

  .personaje { position: relative; display: flex; justify-content: center; }
  .personaje .aura {
    position: absolute; inset: 10% 8%; border-radius: 50%;
    background: radial-gradient(circle, var(--aura, rgba(255,122,26,.55)), transparent 65%);
    filter: blur(14px); animation: latir 3s ease-in-out infinite;
  }
  @keyframes latir { 50% { transform: scale(1.08); opacity: .75; } }
  .personaje img, .personaje .emoji {
    position: relative; width: 100%; max-width: 340px; aspect-ratio: 1; object-fit: cover;
    border-radius: 32px;
    border: 4px solid rgba(255,179,71,.6);
    box-shadow: 0 0 0 8px rgba(42,21,70,.6), var(--sombra);
    animation: flotar 4s ease-in-out infinite;
    background: #1b1030;
  }
  .personaje .emoji { display: flex; align-items: center; justify-content: center; font-size: 150px; }
  @keyframes flotar { 50% { transform: translateY(-12px) rotate(-1.5deg); } }
  @media (max-width: 760px) { .personaje img, .personaje .emoji { max-width: 180px; } .personaje .emoji { font-size: 90px; } }
  .personaje.sacudir img, .personaje.sacudir .emoji { animation: sacudir .5s; }
  @keyframes sacudir { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  .personaje.liberado img, .personaje.liberado .emoji { animation: liberar 1.2s ease forwards; }
  @keyframes liberar { 40% { transform: scale(1.1); filter: brightness(1.8) drop-shadow(0 0 30px #ffd27a); } 100% { transform: scale(1); filter: brightness(1.15) drop-shadow(0 0 22px #ffd27a); } }

  .panel {
    background: linear-gradient(160deg, rgba(61,31,102,.92), rgba(26,12,44,.94));
    border: 2px solid rgba(255,179,71,.4);
    border-radius: 24px; padding: 26px 28px;
    box-shadow: var(--sombra), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(6px);
  }
  @media (max-width: 760px) { .panel { padding: 20px 18px; } }
  .etiqueta { display: inline-block; font-weight: 900; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--lima); margin-bottom: 8px; }
  .nombre-pj { font-family: "Creepster", cursive; font-size: 30px; color: var(--calabaza-2); margin: 0 0 10px; letter-spacing: 1px; }
  h1.titulo {
    font-family: "Creepster", cursive; font-weight: 400; margin: 0;
    font-size: clamp(44px, 8vw, 92px); line-height: .95; letter-spacing: 2px;
    color: var(--calabaza);
    text-shadow: 0 0 18px rgba(255,122,26,.7), 0 6px 0 #6b1f00, 0 10px 30px rgba(0,0,0,.6);
  }
  h1.titulo span { color: var(--lima); text-shadow: 0 0 18px rgba(182,255,59,.6), 0 6px 0 #2a4a00, 0 10px 30px rgba(0,0,0,.6); }
  .subtitulo { font-size: 18px; opacity: .92; margin: 14px 0 0; }
  .dialogo { font-size: 19px; line-height: 1.55; margin: 0 0 18px; }
  .pregunta { font-size: 21px; font-weight: 800; line-height: 1.45; margin: 4px 0 18px; }
  @media (max-width: 760px) { .dialogo { font-size: 17px; } .pregunta { font-size: 18px; } }

  .opciones { display: grid; gap: 12px; }
  .opcion {
    display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%;
    font: inherit; font-size: 17px; font-weight: 700; color: var(--hueso);
    background: rgba(18,9,31,.65); border: 2px solid rgba(255,244,224,.18);
    border-radius: 16px; padding: 14px 16px; cursor: pointer;
    transition: transform .15s, border-color .15s, background .15s;
  }
  .opcion:hover:not(:disabled) { transform: translateX(6px); border-color: var(--calabaza); background: rgba(255,122,26,.14); }
  .opcion:focus-visible { outline: 3px solid var(--lima); outline-offset: 2px; }
  .opcion .letra {
    flex: 0 0 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--calabaza); color: #2a0e00; font-weight: 900;
  }
  .opcion.bien { border-color: var(--lima); background: rgba(182,255,59,.18); }
  .opcion.bien .letra { background: var(--lima); }
  .opcion.mal { border-color: var(--rojo); background: rgba(255,77,109,.18); }
  .opcion.mal .letra { background: var(--rojo); color: #fff; }
  .opcion:disabled { cursor: default; }
  .opciones.vf { grid-template-columns: 1fr 1fr; }

  .retro {
    margin-top: 18px; border-radius: 16px; padding: 16px 18px; font-size: 16px; line-height: 1.55;
    animation: entrar .45s ease;
  }
  .retro.bien { background: rgba(182,255,59,.12); border: 2px solid rgba(182,255,59,.55); }
  .retro.mal { background: rgba(255,77,109,.12); border: 2px solid rgba(255,77,109,.55); }
  .retro strong.cabeza { display: block; font-size: 19px; margin-bottom: 4px; }
  .fuente { display: block; margin-top: 8px; font-size: 13px; opacity: .7; font-style: italic; }

  .acciones { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
  .btn {
    font: inherit; font-weight: 900; font-size: 19px; letter-spacing: .5px;
    border: 0; border-radius: 999px; padding: 15px 30px; cursor: pointer;
    color: #2a0e00; background: linear-gradient(180deg, var(--calabaza-2), var(--calabaza));
    box-shadow: 0 6px 0 #9a3c00, 0 12px 26px rgba(255,122,26,.4);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #9a3c00; }
  .btn:focus-visible { outline: 3px solid var(--lima); outline-offset: 3px; }
  .btn.secundario { color: var(--hueso); background: rgba(255,244,224,.1); border: 2px solid rgba(255,244,224,.35); box-shadow: none; }

  .campo { display: block; margin: 18px 0 6px; font-weight: 800; }
  input[type=text] {
    width: 100%; max-width: 420px; font: inherit; font-size: 18px; color: var(--hueso);
    background: rgba(18,9,31,.75); border: 2px solid rgba(255,179,71,.45); border-radius: 14px; padding: 12px 16px;
  }
  input[type=text]:focus { outline: none; border-color: var(--lima); box-shadow: 0 0 0 4px rgba(182,255,59,.2); }

  .reglas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  @media (max-width: 560px) { .reglas { grid-template-columns: 1fr; } }
  .regla { background: rgba(18,9,31,.6); border: 1px solid rgba(255,244,224,.15); border-radius: 14px; padding: 12px; font-size: 14px; line-height: 1.4; }
  .regla b { display: block; font-size: 22px; margin-bottom: 4px; }

  .mapa { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; }
  .mapa span { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: rgba(255,244,224,.08); border: 1px solid rgba(255,244,224,.15); }
  .mapa span.hecha { background: var(--lima); border-color: var(--lima); color: #1d2e00; }
  .mapa span.actual { background: var(--calabaza-2); border-color: var(--calabaza-2); color: #2a0e00; font-weight: 900; box-shadow: 0 0 14px rgba(255,179,71,.55); }

  .leccion { background: rgba(255,179,71,.12); border-left: 5px solid var(--calabaza-2); border-radius: 12px; padding: 14px 16px; font-size: 17px; line-height: 1.55; margin-top: 6px; }

  /* ---------- Final ---------- */
  .final { text-align: center; }
  .final .panel { max-width: 860px; margin: 0 auto; }
  .medalla { font-size: 86px; animation: flotar 3s ease-in-out infinite; display: inline-block; }
  .puntaje { font-family: "Creepster", cursive; font-size: clamp(54px, 10vw, 96px); color: var(--lima); text-shadow: 0 0 20px rgba(182,255,59,.6); margin: 4px 0; }
  .rango { font-size: 24px; font-weight: 900; color: var(--calabaza-2); }
  .certificado { margin: 14px auto 0; font-size: 15px; opacity: .85; }
  .galeria { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 20px 0 6px; }
  .galeria .mini { width: 74px; height: 74px; border-radius: 50%; overflow: hidden; border: 3px solid var(--lima); background: #1b1030; display: flex; align-items: center; justify-content: center; font-size: 38px; }
  .galeria .mini img { width: 100%; height: 100%; object-fit: cover; }
  .galeria .mini.perdido { border-color: var(--rojo); filter: grayscale(.8); }
  .resumen { text-align: left; margin-top: 18px; }
  .resumen li { margin-bottom: 8px; line-height: 1.5; }
  details { text-align: left; margin-top: 16px; background: rgba(18,9,31,.5); border-radius: 14px; padding: 12px 16px; }
  summary { cursor: pointer; font-weight: 900; color: var(--calabaza-2); }
  .refs p { font-size: 14px; line-height: 1.5; padding-left: 2em; text-indent: -2em; margin: 8px 0; }
  .creditos { font-size: 13px; opacity: .65; margin-top: 18px; }

  .confeti { position: fixed; top: -30px; z-index: 30; pointer-events: none; font-size: 22px; animation: caer linear forwards; }
  @keyframes caer { to { transform: translateY(110vh) rotate(540deg); } }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="fondo"></div>
<div id="fondo-sig"></div>
<div id="velo"></div>
<div id="niebla"></div>
<div id="progreso"></div>

<header id="hud" class="oculto">
  <div class="hud-izq">
    <span class="chip" id="hud-sala">🏚️ Sala 1/5</span>
    <span class="chip" id="hud-puntos">⭐ 0</span>
    <span class="chip" id="velas" aria-label="Velas restantes"></span>
  </div>
  <button id="btn-sonido" aria-label="Activar o silenciar sonido">🔊</button>
</header>

<main id="app" aria-live="polite"></main>

<script>
// ============================================================
//  CONTENIDO DEL JUEGO
//  Tema: Desarrollo emocional en el adulto (UNAD, Psicología y curso de vida)
// ============================================================
const AUTOR = "";            // Escribe aquí tu nombre para que salga en los créditos
const VELAS_INICIALES = 5;

const GUIA = {
  nombre: "Madame Psique",
  img: "img/personajes/madame-psique.webp",
  emoji: "🧙‍♀️",
};

const SALAS = [
  {
    nombre: "El Pasillo de los Espejos",
    monstruo: "Fantasma Ansiedad",
    img: "img/personajes/fantasma-ansiedad.webp",
    emoji: "👻",
    fondo: "img/fondos/sala-1.webp",
    aura: "rgba(182,255,59,.5)",
    tema: "Regulación e inteligencia emocional",
    intro: "¡Bu-bu-buuu! Perdón… estoy nervioso. Llevo siglos sin saber qué hacer con todo lo que siento. Dicen que los adultos aprenden a manejar sus emociones. ¿Me ayudas a entender cómo?",
    leccion: "Las emociones no se eliminan: se reconocen, se comprenden y se regulan. Con la experiencia, la mayoría de los adultos aprende a regularlas mejor que en la adolescencia.",
    preguntas: [
      {
        tipo: "mc",
        texto: "Para Salovey y Mayer, y luego para Goleman, la inteligencia emocional es…",
        opciones: [
          "La capacidad de percibir, comprender, usar y regular las emociones propias y las de los demás.",
          "Tener un coeficiente intelectual alto y buena memoria.",
          "Evitar sentir emociones negativas en todo momento.",
          "Expresar siempre todo lo que se siente, sin ningún filtro.",
        ],
        correcta: 0,
        explicacion: "La inteligencia emocional no consiste en dejar de sentir, sino en reconocer y manejar las emociones. En la adultez se nota en la forma de resolver conflictos con la pareja, en el trabajo y en la familia.",
      },
      {
        tipo: "vf",
        texto: "En general, los adultos regulan mejor sus emociones que los adolescentes.",
        correcta: 0,
        explicacion: "Con la maduración y la experiencia, los adultos desarrollan más estrategias para manejar lo que sienten. Por eso suelen reportar mayor estabilidad emocional a medida que pasan los años.",
      },
      {
        tipo: "caso",
        texto: "Valentina, de 34 años, siente el corazón acelerado antes de presentar un proyecto ante su jefe. ¿Qué estrategia de regulación emocional es más saludable?",
        opciones: [
          "Reinterpretar la situación: «es una oportunidad para mostrar lo que sé» (reevaluación cognitiva).",
          "Fingir que no siente nada y tragarse la emoción (supresión).",
          "Reportarse enferma para no tener que presentar.",
          "Pasar toda la noche imaginando lo que podría salir mal.",
        ],
        correcta: 0,
        explicacion: "Según el modelo de James Gross, la reevaluación cognitiva cambia el significado de la situación y reduce el malestar. La supresión, la evitación y la rumiación lo mantienen o incluso lo aumentan.",
      },
    ],
  },
  {
    nombre: "El Salón del Banquete Vacío",
    monstruo: "Conde Soledad",
    img: "img/personajes/conde-soledad.webp",
    emoji: "🧛",
    fondo: "img/fondos/sala-2.webp",
    aura: "rgba(255,77,109,.5)",
    tema: "Intimidad, amor y relaciones",
    intro: "Tengo una mesa para cien invitados… y nadie con quien cenar. Dicen que en la adultez temprana el gran reto es amar y dejarse amar. ¿Sabes por qué?",
    leccion: "La intimidad verdadera nace de una identidad sólida. El amor maduro combina intimidad, pasión y compromiso, y cambia con el tiempo.",
    preguntas: [
      {
        tipo: "mc",
        texto: "Según Erik Erikson, ¿qué crisis psicosocial se vive en la adultez temprana (aproximadamente de los 20 a los 40 años)?",
        opciones: [
          "Intimidad vs. aislamiento",
          "Identidad vs. confusión de roles",
          "Generatividad vs. estancamiento",
          "Integridad vs. desesperación",
        ],
        correcta: 0,
        explicacion: "En la adultez temprana el reto es crear vínculos íntimos y comprometidos; si no se logra, aparece el aislamiento. La identidad corresponde a la adolescencia, la generatividad a la adultez media y la integridad a la vejez.",
      },
      {
        tipo: "mc",
        texto: "La teoría triangular del amor de Robert Sternberg dice que el amor se compone de…",
        opciones: [
          "Intimidad, pasión y compromiso.",
          "Atracción, celos y dependencia.",
          "Amistad, dinero y familia.",
          "Pasión, posesión y sacrificio.",
        ],
        correcta: 0,
        explicacion: "Cuando están los tres componentes, Sternberg habla de «amor consumado». En las relaciones adultas la pasión suele disminuir con los años, mientras que la intimidad y el compromiso pueden fortalecerse.",
      },
      {
        tipo: "caso",
        texto: "Andrés, de 29 años, cambia de pareja cada pocos meses: cuando la relación se vuelve seria, siente que «se pierde a sí mismo» y se aleja. Según Erikson, ¿qué podría estar pasando?",
        opciones: [
          "No ha consolidado su identidad, y por eso la cercanía le genera miedo a perderse en el otro.",
          "Está viviendo la etapa de integridad vs. desesperación.",
          "Es lo esperable: en la adultez no se necesitan vínculos íntimos.",
          "Tiene un exceso de generatividad.",
        ],
        correcta: 0,
        explicacion: "Erikson planteó que, para lograr una intimidad verdadera, primero hay que tener una identidad propia sólida. Sin ella, el compromiso se vive como una amenaza y la persona tiende al aislamiento.",
      },
    ],
  },
  {
    nombre: "La Oficina-Cripta",
    monstruo: "Momia Rutina",
    img: "img/personajes/momia-rutina.webp",
    emoji: "🧟",
    fondo: "img/fondos/sala-3.webp",
    aura: "rgba(255,179,71,.5)",
    tema: "Estrés, trabajo y generatividad",
    intro: "Trabajo, café, trabajo, café… Estoy tan envuelta en pendientes que olvidé para qué hago todo esto. ¿Me ayudas a encontrarle sentido a la adultez media?",
    leccion: "Cuidar, enseñar y dejar huella en otros (generatividad) protege del estancamiento y le da sentido a la adultez media. El estrés laboral crónico no es pereza: es un problema real que se atiende.",
    preguntas: [
      {
        tipo: "mc",
        texto: "¿Qué es la generatividad, según Erikson y autores como Moreno et al. (2022)?",
        opciones: [
          "El interés por guiar, cuidar y aportar al bienestar de las nuevas generaciones, dejando un legado.",
          "La capacidad de tener muchos hijos.",
          "Generar más dinero que los demás.",
          "Volver a vivir la juventud.",
        ],
        correcta: 0,
        explicacion: "La generatividad puede expresarse en la crianza, la enseñanza, el trabajo, el voluntariado o la creatividad. Es una noción clave para comprender el bienestar en la vida adulta.",
      },
      {
        tipo: "vf",
        texto: "El estancamiento se caracteriza por centrarse solo en uno mismo y sentir que la vida no avanza ni aporta nada a los demás.",
        correcta: 0,
        explicacion: "Es el polo negativo de la etapa generatividad vs. estancamiento (adultez media). Puede vivirse como aburrimiento, vacío o falta de propósito.",
      },
      {
        tipo: "caso",
        texto: "Carmen, de 47 años, es enfermera. Se siente agotada emocionalmente, trata a sus pacientes con frialdad y siente que su trabajo ya no vale la pena. Según Christina Maslach, Carmen presenta…",
        opciones: [
          "Síndrome de burnout: agotamiento emocional, despersonalización y baja realización personal.",
          "Una crisis de identidad propia de la adolescencia.",
          "El efecto de positividad.",
          "Simple pereza: debería esforzarse más.",
        ],
        correcta: 0,
        explicacion: "El burnout es una respuesta al estrés laboral crónico. No es pereza: requiere cambios en las condiciones de trabajo, apoyo social y estrategias de autocuidado.",
      },
    ],
  },
  {

const TOTAL = SALAS.reduce((n, s) => n + s.preguntas.length, 0);

function reiniciarEstado(nombre) {

}

// ============================================================
//  SONIDO (sintetizado, sin archivos)
// ============================================================
let audio = null, sonidoOn = true;
function tono(freq, dur = .15, tipo = "sine", cuando = 0, vol = .12) {
  if (!sonidoOn) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = tipo; o.frequency.value = freq;
    const t = audio.currentTime + cuando;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sonidos = {
  bien:  () => [523, 659, 784].forEach((f, i) => tono(f, .18, "triangle", i * .09)),
  mal:   () => [220, 185].forEach((f, i) => tono(f, .28, "sawtooth", i * .15, .07)),
  click: () => tono(440, .06, "square", 0, .05),
  sala:  () => [392, 523, 659, 784, 1046].forEach((f, i) => tono(f, .22, "triangle", i * .1)),
  miedo: () => [330, 311, 294, 277].forEach((f, i) => tono(f, .35, "sine", i * .18, .08)),
};
document.getElementById("btn-sonido").addEventListener("click", e => {
  sonidoOn = !sonidoOn;
  e.currentTarget.textContent = sonidoOn ? "🔊" : "🔇";
});

//  UTILIDADES DE ESCENA
// ============================================================
const app = document.getElementById("app");
const $ = (sel, raiz = document) => raiz.querySelector(sel);

function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

// Cambia el fondo con fundido; si la imagen no existe, deja el degradado.
let fondoActual = "";
function ponerFondo(url) {
  if (url === fondoActual) return;
  fondoActual = url;
  const img = new Image();
  img.onload = () => {
    const sig = document.getElementById("fondo-sig"), act = document.getElementById("fondo");
    sig.style.backgroundImage = `url("${url}")`;
    sig.style.opacity = 1;
    setTimeout(() => { act.style.backgroundImage = `url("${url}")`; sig.style.opacity = 0; }, 1250);
  };
  img.src = url;
}

// Retrato del personaje: imagen de Codex o emoji de respaldo.
function retrato(pj, aura) {
  return `<div class="personaje" style="--aura:${aura || "rgba(255,122,26,.55)"}">
    <div class="aura"></div>
    <img src="${pj.img}" alt="${esc(pj.monstruo || pj.nombre)}" onerror="this.outerHTML='<div class=&quot;emoji&quot; role=&quot;img&quot; aria-label=&quot;${esc(pj.monstruo || pj.nombre)}&quot;>${pj.emoji}</div>'">
  </div>`;
}

function hud() {
  const h = document.getElementById("hud");
  h.classList.remove("oculto");
  $("#hud-sala").textContent = `🏚️ Sala ${estado.sala + 1}/${SALAS.length}`;
  $("#hud-puntos").textContent = `⭐ ${estado.puntos}`;
  $("#velas").innerHTML = Array.from({ length: VELAS_INICIALES }, (_, i) =>
    `<span class="${i < estado.velas ? "" : "vela-apagada"}">🕯️</span>`).join("");
  document.getElementById("progreso").style.width = `${(estado.respondidas / TOTAL) * 100}%`;
}

function mapa() {
  return `<div class="mapa">${SALAS.map((s, i) =>
    `<span class="${i < estado.sala ? "hecha" : i === estado.sala ? "actual" : ""}">${i < estado.sala ? "✔ " : i === estado.sala ? "📍 " : ""}${i + 1}. ${esc(s.tema)}</span>`).join("")}</div>`;
}

function mezclar(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function confeti(simbolos = ["🎃", "✨", "🦇", "🍬", "⭐"]) {
  for (let i = 0; i < 40; i++) {
    const c = document.createElement("div");
    c.className = "confeti";
    c.textContent = simbolos[i % simbolos.length];
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
    c.style.animationDelay = Math.random() * .8 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 6000);
  }
}

function pantallaSala() {

function pantallaPregunta() {
  const s = SALAS[estado.sala];
  const p = s.preguntas[estado.pregunta];
  hud();
  const base = p.tipo === "vf" ? ["Verdadero", "Falso"] : p.opciones;
  const orden = p.tipo === "vf" ? base.map((t, i) => ({ t, i })) : mezclar(base.map((t, i) => ({ t, i })));
  const tipoTxt = { mc: "Pregunta", vf: "¿Verdadero o falso?", caso: "Caso de la vida real" }[p.tipo];
  app.innerHTML = `
  <section class="pantalla escena">
    ${retrato(s, s.aura)}
    <div class="panel">
      <span class="etiqueta">${tipoTxt} · ${estado.pregunta + 1} de ${s.preguntas.length}</span>
      <p class="nombre-pj">${esc(s.monstruo)} pregunta:</p>
      <p class="pregunta">${esc(p.texto)}</p>
      <div class="opciones ${p.tipo === "vf" ? "vf" : ""}">
        ${orden.map((o, k) => `<button class="opcion" data-i="${o.i}"><span class="letra">${p.tipo === "vf" ? (o.i === 0 ? "V" : "F") : "ABCD"[k]}</span><span>${esc(o.t)}</span></button>`).join("")}
      </div>
      <div id="retro"></div>
    </div>
  </section>`;
  app.querySelectorAll(".opcion").forEach(b => b.addEventListener("click", () => responder(+b.dataset.i, b)));
}

function responder(i, boton) {
  const s = SALAS[estado.sala];
  const p = s.preguntas[estado.pregunta];
  const ok = i === p.correcta;
  app.querySelectorAll(".opcion").forEach(b => {
    b.disabled = true;
    if (+b.dataset.i === p.correcta) b.classList.add("bien");
  });
  estado.respondidas++;
  const pj = $(".personaje");
  if (ok) {
    estado.aciertos++; estado.racha++;
    const bono = estado.racha >= 3 ? 50 : 0;
    estado.puntos += 100 + bono;
    sonidos.bien();
    var cabeza = `✨ ¡Correcto! +100${bono ? ` · racha +${bono}` : ""}`;
  } else {
    boton.classList.add("mal");
    estado.racha = 0; estado.velas--;
    sonidos.mal();
    pj.classList.remove("sacudir"); void pj.offsetWidth; pj.classList.add("sacudir");
    var cabeza = estado.velas > 0 ? "💨 ¡Uy! Se apagó una vela" : "💀 Se apagó tu última vela…";
  }
  hud();
  const ultimaDeSala = estado.pregunta === s.preguntas.length - 1;
  const textoBtn = estado.velas <= 0 ? "Continuar…" : ultimaDeSala ? "Liberar al monstruo ✨" : "Siguiente reto ➜";
  $("#retro").innerHTML = `
    <div class="retro ${ok ? "bien" : "mal"}">
      <strong class="cabeza">${cabeza}</strong>
      ${esc(p.explicacion)}
    </div>
    <div class="acciones"><button class="btn" id="seguir">${textoBtn}</button></div>`;
  $("#seguir").focus({ preventScroll: true });
  $("#retro").scrollIntoView({ behavior: "smooth", block: "nearest" });
  $("#seguir").addEventListener("click", () => {
    sonidos.click();
    if (estado.velas <= 0) return pantallaFinal(false);
    if (ultimaDeSala) return pantallaLiberado();
    estado.pregunta++;
    pantallaPregunta();
  });
}

function pantallaLiberado() {
  const s = SALAS[estado.sala];
  estado.liberados.push(estado.sala);
  sonidos.sala();
  confeti(["✨", "🕯️", "⭐"]);
  const ultima = estado.sala === SALAS.length - 1;
  app.innerHTML = `
  <section class="pantalla escena">
    ${retrato(s, "rgba(255,210,122,.7)")}
    <div class="panel">
      <span class="etiqueta">¡Sala ${estado.sala + 1} superada!</span>
      <p class="nombre-pj">Liberaste a ${esc(s.monstruo)}</p>

      <div class="leccion">💡 ${esc(s.leccion)}</div>
      <div class="acciones"><button class="btn" id="seguir">${ultima ? "Ver mi resultado 🏆" : "Ir a la siguiente sala 🚪"}</button></div>
    </div>
  </section>`;
  $(".personaje").classList.add("liberado");
  $("#seguir").addEventListener("click", () => {
    sonidos.click();
    if (ultima) return pantallaFinal(true);
    estado.sala++; estado.pregunta = 0;
    pantallaSala();
  });
}

function rango(aciertos) {
  const pct = aciertos / TOTAL;
  if (pct >= .93) return { medalla: "🏆", titulo: "Maestro/a de las Emociones", frase: "Dominas el desarrollo emocional adulto como toda una eminencia de la psicología." };
  if (pct >= .73) return { medalla: "🥇", titulo: "Psicólogo/a de la Mansión", frase: "Comprendes muy bien cómo cambian las emociones en la adultez." };
  if (pct >= .5)  return { medalla: "🔮", titulo: "Aprendiz de Brujería Emocional", frase: "Vas por buen camino; repasa las lecciones de las salas." };
  return { medalla: "👻", titulo: "Alma en Pena", frase: "La mansión aún guarda secretos para ti. ¡Inténtalo de nuevo!" };
}

        <button class="btn" id="otra">🔁 Jugar otra vez</button>
      </div>
      <p class="creditos">La Mansión de las Emociones · Psicología y curso de vida (402537617) · UNAD${AUTOR ? " · Creado por " + esc(AUTOR) : ""}</p>
    </div>
  </section>`;
  $("#otra").addEventListener("click", () => { sonidos.click(); pantallaInicio(); });
}
